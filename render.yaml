services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: leadforge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SAVE_LOCAL_CSV
        value: "false"
      - key: USE_PLAYWRIGHT
        value: "false"
      - key: WEBSITE_FINDER_THOROUGH
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_FILE
        value: credentials.json

  # ── Frontend (static site) ───────────────────────────────────────────────
  - type: web
    name: leadforge-ui
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: leadforge-api
          envVarKey: RENDER_EXTERNAL_URL
